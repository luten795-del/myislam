<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Offline Lesson - MyIslam</title>
    <link rel="stylesheet" href="/assets/css/theme.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#166534">
    <style>
        /* Minimal chrome for the offline shell - NOT the same as
           includes/header.php's full nav/sidebar, since this page must
           render with zero server contact and can't run PHP. Keep this
           block small; theme.css already supplies the real design tokens
           (colors, spacing) so this only needs structural layout. */
        body { min-height: 100vh; }
        .offline-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: var(--header-bg);
            border-bottom: 1px solid var(--line);
        }
        .offline-topbar a {
            color: var(--brand);
            text-decoration: none;
            font-weight: 600;
        }
        .offline-container {
            max-width: var(--content-width, 800px);
            margin: 0 auto;
            padding: 24px 20px 80px;
        }
        .lesson-title { margin-bottom: 12px; color: var(--text); }
        .offline-badge {
            display: inline-block;
            background: var(--brand-soft);
            color: var(--brand);
            padding: 6px 12px;
            border-radius: var(--radius-sm, 8px);
            font-size: var(--text-sm, 13px);
            margin-bottom: 20px;
        }
        .offline-part-nav { display: flex; gap: 8px; margin-top: 24px; flex-wrap: wrap; }
        .offline-part-nav button {
            padding: 8px 14px;
            border-radius: var(--radius-sm, 8px);
            border: 1px solid var(--line);
            background: var(--surface-2);
            color: var(--text);
            cursor: pointer;
        }
        .offline-part-nav button.active {
            background: var(--brand);
            color: #fff;
            border-color: var(--brand);
        }
        .offline-empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
        }
        .offline-empty-state a {
            display: inline-block;
            margin-top: 16px;
            color: var(--brand);
            font-weight: 600;
        }
    </style>
</head>
<body class="dark-mode">

<div class="offline-topbar">
    <a href="/subjects.php">← Back</a>
    <span style="color:var(--muted);font-size:13px;">📶 Offline mode</span>
    <button id="themeToggle" class="icon-btn" aria-label="Toggle theme" style="background:none;border:none;font-size:18px;cursor:pointer;">☀</button>
</div>

<div class="offline-container" id="lessonContainer">
    <p style="color:var(--muted);">Loading your downloaded lesson…</p>
</div>

<script src="/assets/js/offline-db.js"></script>
<script src="/assets/js/offline-render.js"></script>
<script>
    (function () {
        // Same dark/light toggle behavior as includes/footer.php, kept in
        // sync manually since this page can't include that PHP file.
        const themeToggle = document.getElementById('themeToggle');
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            document.body.classList.remove('dark-mode');
            document.body.classList.add('light-mode');
            themeToggle.textContent = '🌙';
        }
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            document.body.classList.toggle('light-mode');
            const isDark = document.body.classList.contains('dark-mode');
            themeToggle.textContent = isDark ? '☀' : '🌙';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });

        async function boot() {
            const container = document.getElementById('lessonContainer');
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug');
            const id = params.get('id');
            const partNumber = params.get('part') ? parseInt(params.get('part'), 10) : 1;

            try {
                let lesson = null;
                if (id) {
                    lesson = await OfflineDB.getLesson(id);
                } else if (slug) {
                    lesson = await OfflineDB.getLessonBySlug(slug);
                }

                if (!lesson) {
                    container.innerHTML = `
                        <div class="offline-empty-state">
                            <p>📭 This lesson isn't downloaded yet.</p>
                            <p>Connect to the internet, open the lesson, and tap "Download for offline" first.</p>
                            <a href="/subjects.php">Browse subjects</a>
                        </div>`;
                    return;
                }

                OfflineRenderer.render(lesson, container, partNumber);
            } catch (err) {
                console.error('Offline lesson load failed:', err);
                container.innerHTML = '<p style="color:var(--danger);">Could not load this lesson offline. Please try again.</p>';
            }
        }

        boot();
    })();
</script>

</body>
</html>
