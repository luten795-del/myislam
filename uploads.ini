; ============================================
; PHP Upload Configuration for MyIslam Project
; ============================================

; ------------------------------------------------------------------
; FILE UPLOAD SETTINGS
; ------------------------------------------------------------------

; Enable file uploads (On by default, but explicitly set)
file_uploads = On

; Maximum size of a single file that can be uploaded
; This should be large enough for audio/video attachments
upload_max_filesize = 64M

; Maximum size of POST data (must be larger than upload_max_filesize)
; Includes all form data + file attachments
post_max_size = 70M

; Maximum amount of memory PHP can use
; Should be at least as large as post_max_size
memory_limit = 128M

; Maximum execution time for a script (seconds)
; 300 seconds = 5 minutes
max_execution_time = 300

; Maximum time to parse input data (seconds)
max_input_time = 300

; Maximum number of files that can be uploaded in one request
max_file_uploads = 20

; ------------------------------------------------------------------
; ADDITIONAL RECOMMENDED SETTINGS
; ------------------------------------------------------------------

; Allow uploading of specific file types
; (This is usually handled by application-level validation)
; upload_tmp_dir = /tmp

; Disable execution of PHP files in upload directories (security)
; (This is usually handled by .htaccess or Nginx config)

; ------------------------------------------------------------------
; ERROR HANDLING FOR UPLOADS
; ------------------------------------------------------------------

; Display upload errors (useful for debugging)
display_errors = On

; Log upload errors
log_errors = On

; Error log file location (adjust as needed)
; error_log = /var/log/php_errors.log
